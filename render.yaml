version: "1"

services:
  - type: web
    name: urukais-klick-app
    runtime: docker
    repo: https://github.com/urukaisk-maker/urukais-klick-app
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/docs
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: urukais-klick-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://urukais-klick.vercel.app

databases:
  - name: urukais-klick-db
    plan: free
    region: oregon
    databaseName: urukais_klick
    user: urukais
