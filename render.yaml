services:
  # ============================================
  # ⚙️ BACKEND (NestJS)
  # ============================================
  - type: web
    name: urukais-klick-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: frankfurt  # o oregon, ohio, singapore
    healthCheckPath: /api/docs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: urukais-klick-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        value: https://urukais-klick.vercel.app  # se actualizará luego

# ============================================
# 🗄️ BASE DE DATOS
# ============================================
databases:
  - name: urukais-klick-db
    plan: free
    region: frankfurt
    databaseName: urukais_klick
    user: urukais
